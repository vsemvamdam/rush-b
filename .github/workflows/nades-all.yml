name: Раскидки — вся база про-демок

# Разбирает весь открытый архив OpenCS2 (Hugging Face blanchon/opencs2_dataset_demo, CC BY 4.0,
# ~2000 карт HLTV) порциями: каждый запуск — до LIMIT демок в SHARDS параллельных задачах;
# если что-то осталось, сразу запускает следующую порцию (и ещё раз каждые 2 часа по расписанию).
# Уже разобранное текущей версией разборщика не трогает. Всё хранится в релизе data-store
# (nades-raw — броски, nades-proc — список разобранного, nades-site — готовые данные для сайта),
# в git ничего не коммитится.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Сколько демок за запуск'
        default: '480'
      shards:
        description: 'Параллельных задач'
        default: '16'
  schedule:
    - cron: '7 */2 * * *'
  push:
    branches: [main]
    paths: ['tools/demos/opencs2.py', 'tools/demos/extract_nades.py', 'tools/demos/build_lineups.py', '.github/workflows/nades-all.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: nades-all
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      count: ${{ steps.p.outputs.count }}
      matrix: ${{ steps.p.outputs.matrix }}
      remaining: ${{ steps.p.outputs.remaining }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install huggingface_hub pandas pyarrow
      - run: scripts/store.sh pull nades-proc
      - id: p
        # значения из формы запуска передаются через переменные окружения, а не подставляются в текст команды
        env:
          LIMIT: ${{ inputs.limit || '480' }}
          SHARDS: ${{ inputs.shards || '16' }}
        run: python3 tools/demos/opencs2.py plan --limit "$LIMIT" --shards "$SHARDS" --out plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: plan.json

  shard:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install demoparser2 huggingface_hub
      - uses: actions/download-artifact@v4
        with:
          name: plan
      - name: Разбор своей части демок
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 tools/demos/opencs2.py shard --plan plan.json --index "$SHARD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-${{ matrix.shard }}
          path: store/nades-raw-new/
          if-no-files-found: ignore
          retention-days: 3

  aggregate:
    needs: [plan, shard]
    # new demos parsed, or the library builder changed (push) — rebuild the site data
    if: always() && (needs.plan.outputs.count != '0' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: raw-*
          path: store/nades-raw-new
          merge-multiple: true
      - run: pip install demoparser2
      - name: Объединить с базой бросков
        run: |
          scripts/store.sh pull nades-raw
          scripts/store.sh pull nades-proc
          mkdir -p store/nades-raw
          python3 tools/demos/opencs2.py mark-done store/nades-raw-new/_done-*.txt || python3 tools/demos/opencs2.py mark-done
          rm -f store/nades-raw-new/_done-*.txt
          cp store/nades-raw-new/*.json store/nades-raw/ 2>/dev/null || true
          # свои демки из tools/demos/urls.txt (разбираются один раз для каждой версии разборщика)
          python3 tools/demos/opencs2.py ingest --from-urls tools/demos/urls.txt || true
      - name: Собрать раскидки, коллауты и игроков
        run: python3 tools/demos/build_lineups.py --out store/nades-site
      - name: Сохранить и пересобрать сайт
        env:
          REMAINING: ${{ needs.plan.outputs.remaining }}
        run: |
          scripts/store.sh push nades-raw
          scripts/store.sh push nades-proc
          scripts/store.sh push nades-site
          gh workflow run site.yml -f quick=true
          if [ "$REMAINING" != "0" ]; then
            echo "осталось $REMAINING демок — запускаю следующую порцию"
            gh workflow run nades-all.yml
          fi
